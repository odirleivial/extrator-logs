# ===========================================================================
# Server Agent SP - Configuracao
# ===========================================================================

#configuração da conta de e-mail (ajuste se este agente for usar outra conta)
email=ovm.extrator.logs@gmail.com
senha=webnwminnrvjafic
intervalo_minutos=1

#nivel de detalhe do log: DEBUG | INFO | WARN | ERROR
#  DEBUG = tudo, inclusive as varreduras sem novidade (gera arquivo grande)
#  INFO  = operacoes relevantes (padrao recomendado)
#  WARN  = apenas avisos e erros
log.level=INFO

#credenciais Windows para acesso às pastas de rede dos servidores.
#RECOMENDADO DEIXAR VAZIO: como o PAM troca a senha diariamente, qualquer senha
#gravada aqui quebra em 24h. Com os campos vazios o agente usa a identidade do
#próprio serviço — que na rede é a CONTA DE COMPUTADOR deste servidor
#(DOMINIO\NOMEDESTESERVIDOR$), gerenciada pelo AD e sem expiração.
#Para funcionar assim, essa conta de computador precisa ter leitura nas pastas
#de log dos servidores 10.56.62.139/140/152 — veja o LEIA-ME.txt.
#Preencha apenas se houver uma conta de serviço com senha fixa.
windows_user=
windows_senha=

#modo debug: quando true, grava logs detalhados de diagnóstico
debug=false

# ===========================================================================
# Logs disponíveis para extração — DIA CORRENTE
# Formato: log.<nome>.caminho = pasta onde o arquivo/pasta está (UNC ou local)
#          log.<nome>.formato = nomenclatura do arquivo ou da pasta:
#             {texto}  -> parte fixa do nome
#             [tokens] -> data: yyyy=ano 4 díg., yy=ano 2 díg., mm=mês, dd=dia
#             (xxx)    -> curinga: casa com qualquer texto
#             texto fora dos delimitadores (ex.: extensão) é mantido como está
#          log.<nome>.tipo    = arquivo | pasta  (opcional, padrão arquivo)
#                               com pasta, a pasta inteira vai compactada
# Exemplos: {integrador}.log              -> integrador.log
#           {lgComandosSQL_}[YYYYmmdd].txt -> lgComandosSQL_20260803.txt
#           [ddmmyyyy].log                -> 03082026.log
#           [yyyymmdd] + tipo=pasta       -> compacta a pasta 20260806
# A data usada nos formatos é a atual, ou a do campo "Data:" do e-mail.
# ===========================================================================

