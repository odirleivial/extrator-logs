# ===========================================================================
# Logs históricos (dias anteriores)
#
# Usados quando o campo "Data:" do e-mail é anterior à data atual. Se a data
# for a de hoje (ou não vier no e-mail), valem as configurações log.<nome>.*
# acima.
#
# Formato: historico.<nome>.caminho = pasta base onde o arquivo/pasta fica
#          historico.<nome>.formato = nomenclatura do arquivo ou da pasta
#          historico.<nome>.tipo    = arquivo | pasta
#
# O CAMINHO também aceita os tokens abaixo — use quando a data estiver na pasta
# e não no nome do arquivo (ex.: ...\logsTesouraria\[yyyymmdd]).
#
# Tokens do formato:
#   [..] ou {..} -> data quando o conteúdo só tem marcadores de data
#                   (yyyy, yy, mm, dd, hh, ss); caso contrário, texto fixo
#   (xxx)        -> curinga: casa com qualquer texto (sufixos de rotação
#                   como ".0", ".2.log")
#   (LOJA)/(PDV) -> variáveis da solicitação (não usadas nos logs de servidor)
#   texto fora dos delimitadores é mantido como está
#
# Quando tipo=pasta, a pasta inteira é compactada no anexo. Se vários logs
# apontarem para a mesma pasta, ela é incluída uma única vez.
#
# Exemplos: {linx-webservices_}[yyyy-mm-dd](xxx).zip
#                                 -> linx-webservices_2026-08-03.0.zip
#           [yyyymmdd]            -> 20260803  (pasta)
# ===========================================================================

# webservices (10.56.62.152) - zips rotacionados por dia
historico.webservices.caminho=\\10.56.62.152\d$\linx-wildfly\standalone\data\linx-webservices\logs
historico.webservices.formato={linx-webservices_}[yyyy-mm-dd](xxx).zip
historico.webservices.tipo=arquivo

