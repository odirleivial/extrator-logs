# === Oracle - consultas SQL disponíveis ===
oracle_query_names=P2K_ITEM_TRANSACAO,P2K_CAB_TRANSACAO,VALIDA_REFORMA_TRIB,P2K_CAB_CAMPANHA,P2K_ITEM_CAMPANHA,ITENS_DESCONTO,VALE_TROCA_30_DIAS
oracle_query.P2K_ITEM_TRANSACAO=select * from DBCSI_P2K.P2K_ITEM_TRANSACAO where data_transacao = $DATA and codigo_loja = to_number($LOJA) and NSU_TRANSACAO in($NSU) and NUMERO_COMPONENTE = $PDV order by NSU_TRANSACAO desc
oracle_query.P2K_CAB_TRANSACAO=select * from p2k_cab_transacao t where t.data_transacao = $DATA and  t.codigo_loja = to_number('$LOJA') and NUMERO_COMPONENTE = $PDV AND NSU_TRANSACAO IN($NSU) order by NSU_TRANSACAO desc
oracle_query.VALIDA_REFORMA_TRIB=select cab.CODIGO_LOJA, cab.DATA_TRANSACAO, cab.NUMERO_COMPONENTE, cab.NSU_TRANSACAO, cab.numero_cupom, cab.chave_acesso_nfe, item.CODIGO_PRODUTO, item.CODIGO_NCM, P.COD_CATEGORIA_FISCAL, item.QTD_VENDIDA, item.VALOR_UNITARIO_PRODUTO, item.VALOR_TOTAL_PRODUTO, item.VALOR_DESCONTO, item.COD_CST_IBS_CBS, tax.CST_CBS_IBS CST_CBS_IBS_MATRIZ, case when item.COD_CST_IBS_CBS = tax.CST_CBS_IBS Then '---SIM' else 'NÃO---' end CST_CORRETO, item.COD_CLASSTRIB_IBS_CBS, tax.CCLASSTRIB CCLASSTRIB_MATRIZ, case when item.COD_CLASSTRIB_IBS_CBS = tax.CCLASSTRIB Then '---SIM' else 'NÃO---' end CCLASSTRIB_CORRETO, item.VAL_BASE_IBS_CBS, ((item.QTD_VENDIDA*item.VALOR_UNITARIO_PRODUTO)- item.VALOR_DESCONTO) -(NVL(VALOR_PIS,0)+NVL(VALOR_COFINS,0)+NVL(VAL_FCP,0)+NVL(VALOR_ICMS,0))VAL_BASE_IBS_CBS_CALCULADO, case when item.VAL_BASE_IBS_CBS = ((item.QTD_VENDIDA*item.VALOR_UNITARIO_PRODUTO)- item.VALOR_DESCONTO) -(NVL(VALOR_PIS,0)+NVL(VALOR_COFINS,0)+NVL(VAL_FCP,0)+NVL(VALOR_ICMS,0)) Then '---SIM' else 'NÃO---' end BASECBSIBS_CORRETO, item.ALIQ_CBS, tax.ALIQUOTA_CBS ALIQUOTA_CBS_MATRIZ, case when item.ALIQ_CBS = tax.ALIQUOTA_CBS Then '---SIM' else 'NÃO---' end ALIQUOTA_CBS_CORRETO, item.VAL_CALC_CBS, case when tax.PERC_RED_CBS = 100 then 0 when tax.PERC_RED_CBS between 1 and 99 then Round( (((item.QTD_VENDIDA*item.VALOR_UNITARIO_PRODUTO)- item.VALOR_DESCONTO) -(NVL(VALOR_PIS,0)+NVL(VALOR_COFINS,0)+NVL(VAL_FCP,0)+NVL(VALOR_ICMS,0))) *(( tax.ALIQUOTA_CBS * (1-(tax.PERC_RED_CBS/100)))/100),2) when tax.PERC_RED_CBS = 0 then Round( (((item.QTD_VENDIDA*item.VALOR_UNITARIO_PRODUTO)- item.VALOR_DESCONTO) -(NVL(VALOR_PIS,0)+NVL(VALOR_COFINS,0)+NVL(VAL_FCP,0)+NVL(VALOR_ICMS,0))) *( tax.ALIQUOTA_CBS/100),2) else 0 end Valor_CBS_CALCULADO, case when NVL(item.VAL_CALC_CBS,0) = case when tax.PERC_RED_CBS = 100 then 0 when tax.PERC_RED_CBS between 1 and 99 then Round( (((item.QTD_VENDIDA*item.VALOR_UNITARIO_PRODUTO)- item.VALOR_DESCONTO) -(NVL(VALOR_PIS,0)+NVL(VALOR_COFINS,0)+NVL(VAL_FCP,0)+NVL(VALOR_ICMS,0))) *(( tax.ALIQUOTA_CBS * (1-(tax.PERC_RED_CBS/100)))/100),2) when tax.PERC_RED_CBS = 0 then Round( (((item.QTD_VENDIDA*item.VALOR_UNITARIO_PRODUTO)- item.VALOR_DESCONTO) -(NVL(VALOR_PIS,0)+NVL(VALOR_COFINS,0)+NVL(VAL_FCP,0)+NVL(VALOR_ICMS,0))) *( tax.ALIQUOTA_CBS/100),2) else 0 end Then '---SIM' else 'NÃO---' end as Valor_CBS_CORRETO, item.ALIQ_IBS_ESTADUAL, tax.ALIQUOTA_IBS_ESTADUAL ALIQUOTA_IBS_ESTADUAL_MATRIZ, case when item.ALIQ_IBS_ESTADUAL = tax.ALIQUOTA_IBS_ESTADUAL Then '---SIM' else 'NÃO---' end ALIQUOTA_IBS_CORRETO, item.VAL_CALC_IBS_ESTADUAL, case when tax.PERC_RED_IBS = 100 then 0 when tax.PERC_RED_IBS between 1 and 99 then Round( (((item.QTD_VENDIDA*item.VALOR_UNITARIO_PRODUTO)- item.VALOR_DESCONTO) -(NVL(VALOR_PIS,0)+NVL(VALOR_COFINS,0)+NVL(VAL_FCP,0)+NVL(VALOR_ICMS,0))) *(( tax.ALIQUOTA_IBS_ESTADUAL * (1-(tax.PERC_RED_IBS/100)))/100),2) when tax.PERC_RED_IBS = 0 then Round( (((item.QTD_VENDIDA*item.VALOR_UNITARIO_PRODUTO)- item.VALOR_DESCONTO) -(NVL(VALOR_PIS,0)+NVL(VALOR_COFINS,0)+NVL(VAL_FCP,0)+NVL(VALOR_ICMS,0))) *( tax.ALIQUOTA_IBS_ESTADUAL/100),2) else 0 end Valor_IBS_ESTADUAL_CALCULADO, case when NVL(item.VAL_CALC_IBS_ESTADUAL,0) = case when tax.PERC_RED_IBS = 100 then 0 when tax.PERC_RED_IBS between 1 and 99 then Round( (((item.QTD_VENDIDA*item.VALOR_UNITARIO_PRODUTO)- item.VALOR_DESCONTO) -(NVL(VALOR_PIS,0)+NVL(VALOR_COFINS,0)+NVL(VAL_FCP,0)+NVL(VALOR_ICMS,0))) *(( tax.ALIQUOTA_IBS_ESTADUAL * (1-(tax.PERC_RED_IBS/100)))/100),2) when tax.PERC_RED_IBS = 0 then Round( (((item.QTD_VENDIDA*item.VALOR_UNITARIO_PRODUTO)- item.VALOR_DESCONTO) -(NVL(VALOR_PIS,0)+NVL(VALOR_COFINS,0)+NVL(VAL_FCP,0)+NVL(VALOR_ICMS,0))) *( tax.ALIQUOTA_IBS_ESTADUAL/100),2) else 0 end Then '---SIM' else 'NÃO---' end as Valor_IBS_ESTADUAL_CORRETO, item.ALIQ_IBS_MUNICIPAL, tax.ALIQUOTA_IBS_MUNICIPAL ALIQUOTA_IBS_ESTADUAL_MATRIZ, case when item.ALIQ_IBS_MUNICIPAL = tax.ALIQUOTA_IBS_MUNICIPAL Then '---SIM' else 'NÃO---' end ALIQUOTA_IBS_CORRETO, item.VAL_CALC_IBS_MUNICIPAL, case when tax.PERC_RED_IBS = 100 then 0 when tax.PERC_RED_IBS between 1 and 99 then Round( (((item.QTD_VENDIDA*item.VALOR_UNITARIO_PRODUTO)- item.VALOR_DESCONTO) -(NVL(VALOR_PIS,0)+NVL(VALOR_COFINS,0)+NVL(VAL_FCP,0)+NVL(VALOR_ICMS,0))) *(( tax.ALIQUOTA_IBS_MUNICIPAL * (1-(tax.PERC_RED_IBS/100)))/100),2) when tax.PERC_RED_IBS = 0 then Round( (((item.QTD_VENDIDA*item.VALOR_UNITARIO_PRODUTO)- item.VALOR_DESCONTO) -(NVL(VALOR_PIS,0)+NVL(VALOR_COFINS,0)+NVL(VAL_FCP,0)+NVL(VALOR_ICMS,0))) *( tax.ALIQUOTA_IBS_MUNICIPAL/100),2) else 0 end Valor_IBS_MUNICIPAL_CALCULADO, case when NVL(item.VAL_CALC_IBS_MUNICIPAL,0) = case when tax.PERC_RED_IBS = 100 then 0 when tax.PERC_RED_IBS between 1 and 99 then Round( (((item.QTD_VENDIDA*item.VALOR_UNITARIO_PRODUTO)- item.VALOR_DESCONTO) -(NVL(VALOR_PIS,0)+NVL(VALOR_COFINS,0)+NVL(VAL_FCP,0)+NVL(VALOR_ICMS,0))) *(( tax.ALIQUOTA_IBS_MUNICIPAL * (1-(tax.PERC_RED_IBS/100)))/100),2) when tax.PERC_RED_IBS = 0 then Round( (((item.QTD_VENDIDA*item.VALOR_UNITARIO_PRODUTO)- item.VALOR_DESCONTO) -(NVL(VALOR_PIS,0)+NVL(VALOR_COFINS,0)+NVL(VAL_FCP,0)+NVL(VALOR_ICMS,0))) *( tax.ALIQUOTA_IBS_MUNICIPAL/100),2) else 0 end Then '---SIM' else 'NÃO---' end as Valor_IBS_MUNICIPAL_CORRETO from p2k_item_transacao item join p2k_cab_transacao cab on item.CODIGO_LOJA = cab.CODIGO_LOJA and item.DATA_TRANSACAO = cab.DATA_TRANSACAO and item.NUMERO_COMPONENTE = cab.NUMERO_COMPONENTE and item.NSU_TRANSACAO = cab.NSU_TRANSACAO join produto p on p.cod_prod = item.CODIGO_PRODUTO left join tax_cbs_ibs tax on tax.NCM = p.COD_CATEGORIA_FISCAL where cab.data_transacao >= $DATA and cab.codigo_loja = to_number('$LOJA') and cab.NSU_TRANSACAO IN($NSU) and cab.NUMERO_COMPONENTE = $PDV and item.status_item = 'V' and item.FORMA_ENTREGA = 'RL'
oracle_query.P2K_CAB_CAMPANHA=select * from p2k_cab_campanha c where c.data_transacao = $DATA and c.codigo_loja = to_number('$LOJA') and c.NUMERO_COMPONENTE = $PDV AND NSU_TRANSACAO IN($NSU) order by NSU_TRANSACAO desc
oracle_query.P2K_ITEM_CAMPANHA=select * from p2k_item_campanha c where c.data_transacao = $DATA and c.codigo_loja = to_number('$LOJA') and c.NUMERO_COMPONENTE = $PDV AND NSU_TRANSACAO IN($NSU) order by NSU_TRANSACAO desc
oracle_query.ITENS_DESCONTO=select distinct t.codigo_loja, t.NUMERO_COMPONENTE, t.NSU_TRANSACAO,t.data_transacao, t.NUM_SEQ_PRODUTO, t.CODIGO_PRODUTO,t.DESC_COMPLETA_PROD, t.QTD_VENDIDA, t.VALOR_UNITARIO_PRODUTO, t.VALOR_TOTAL_PRODUTO, t.VALOR_DESCONTO, c.DESC_ITEM, c.COD_MOTIVO_EXT, cc.descr_promocao from p2k_item_transacao t left join p2k_item_campanha c on ( t.data_transacao = c.data_transacao and t.NUMERO_COMPONENTE = c.NUMERO_COMPONENTE and t.NSU_TRANSACAO = c.NSU_TRANSACAO and t.NUM_SEQ_PRODUTO = c.NUM_SEQ_ITEM_TRANSACAO ) left join p2k_cab_campanha cc on (t.data_transacao = cc.data_transacao and t.codigo_loja = cc.codigo_loja and t.NUMERO_COMPONENTE = cc.NUMERO_COMPONENTE and t.NSU_TRANSACAO = cc.NSU_TRANSACAO and c.NUM_SEQ_CAMPANHA = cc.NUM_SEQ_CAMPANHA ) where t.data_transacao = $DATA and t.codigo_loja = to_number('$LOJA') and t.NUMERO_COMPONENTE = $PDV and t.NSU_TRANSACAO IN($NSU) order by 3,5
oracle_query.VALE_TROCA_30_DIAS=SELECT CT.COD_CPF_CNPJ_ALFA as CPF_CNPJ_CLIENTE, VT.NU_VALE_TROCA,  MOV.VALOR_TOTAL_TRANSACAO as VALOR, UPPER(CT.NOME) AS NOME, CT.TP_CLIENTE,  MOV.NUMERO_LOJA,  MOV.DATA_HORA_SAFE,  VT.CD_STATUS_VALE,  DECODE(VT.CD_STATUS_VALE,'E','EMITIDO','U','UTILIZADO','A','ANULADO','I','INVALIDO','R','REEMBOLSADO','B','BAIXA MANUAL','P','PENDENTE','X','BLOQUEADO') DS_STATUS_VALE,  DECODE(MOV.IND_STATUS_TRANSACAO,'P','PENDENTE','M','PENDENTE','X','CANCELADA','C','CONFIRMADA','D','DESFEITA') AS ST_TRANS  FROM CLIENTES_TROCA CT,  SSF_VALE_TROCA VT,  MOVIMENTO_SSF MOV WHERE CT.COD_CPF_CNPJ_ALFA = VT.COD_CPF_CNPJ_ALFA AND CT.TP_CLIENTE = VT.TP_CLIENTE  AND VT.NSU_SAFE_EMISSAO = MOV.NSU_SAFE  AND MOV.DATA_HORA_SAFE > sysdate -30 ORDER BY 2 DESC

