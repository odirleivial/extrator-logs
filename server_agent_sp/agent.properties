historico.ProcTrans_CSIDebugFileSO.formato=[yyyymmdd]
historico.ProcTrans_CSIDebugFileSO.tipo=pasta

# ProcTrans_communication (10.56.62.140) - zips rotacionados por dia
historico.ProcTrans_communication.caminho=\\10.56.62.140\d$\p2k\binProcTrans\logger\communication
historico.ProcTrans_communication.formato={communication_}[yyyy-mm-dd](xxx).zip
