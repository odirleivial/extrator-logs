<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Solicitar Logs</title>
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='styles.css') }}">
    <script>
        var config = {{ config_props | tojson | safe }};

        function converterParaArray(valor) {
            if (typeof valor === 'string') {
                return valor.split(',').map(v => v.trim()).filter(v => v);
            }
            return Array.isArray(valor) ? valor : [];
        }

        function populaLojas() {
            var lojasSelect = document.getElementById("loja");
            lojasSelect.innerHTML = "";
            var lojas = converterParaArray(config['stores']);
            lojas.forEach(function(loja) {
                var opt = document.createElement("option");
                opt.value = loja;
                opt.innerHTML = loja;
                lojasSelect.appendChild(opt);
            });
        }

        function populaPdvs() {
            var pdvSelect = document.getElementById("pdv");
            var lojaSelecionada = document.getElementById("loja").value;
            pdvSelect.innerHTML = "";
            var pdvs = converterParaArray(config[lojaSelecionada + "_pdvs"]);
            pdvs.forEach(function(pdv) {
                var opt = document.createElement("option");
                opt.value = pdv;
                opt.innerHTML = pdv;
                pdvSelect.appendChild(opt);
            });
        }

        function atualizaLogs() {
            var logsDiv = document.getElementById("logs");
            var lojaSelecionada = document.getElementById("loja").value;
            logsDiv.innerHTML = '';

            if (lojaSelecionada === 'SERVERS_EP_SP') {
                // Logs dos servidores EP SP (Server Agent SP): entradas "nome;ip"
                converterParaArray(config['logs_sp']).forEach(function(item) {
                    var partes = item.split(';');
                    var nome = partes[0].trim();
                    var ip = (partes[1] || '').trim();
                    if (!nome) return;
                    var label = document.createElement("label");
                    if (ip) label.title = "Servidor: " + ip;
                    var checkbox = document.createElement("input");
                    checkbox.type = "checkbox";
                    checkbox.name = "logs";
                    checkbox.value = nome;
                    label.appendChild(checkbox);
                    label.appendChild(document.createTextNode(nome));
                    logsDiv.appendChild(label);
                });
                return;
            }

            var logs = converterParaArray(config['logs']);
            logs.forEach(function(log) {
                var label = document.createElement("label");
                var checkbox = document.createElement("input");
                checkbox.type = "checkbox";
                checkbox.name = "logs";
                checkbox.value = log;
                label.appendChild(checkbox);
                label.appendChild(document.createTextNode(log));
                logsDiv.appendChild(label);
            });
        }

        function atualizaVisibilidadePdv() {
            var isSp = document.getElementById("loja").value === 'SERVERS_EP_SP';
            document.getElementById("pdv-container").style.display = isSp ? 'none' : '';
            document.getElementById("pdv").required = !isSp;
        }

        function dataHojeISO() {
            var hoje = new Date();
            var mes = String(hoje.getMonth() + 1).padStart(2, '0');
            var dia = String(hoje.getDate()).padStart(2, '0');
            return hoje.getFullYear() + '-' + mes + '-' + dia;
        }

        function preencherDataAtual() {
            var campo = document.getElementById("data");
            // Bloqueia datas futuras no popup de calendário
            campo.max = dataHojeISO();
            campo.value = dataHojeISO();
        }

        function limparCampos() {
            document.getElementById("painel").reset();
            atualizaLogs();
            populaPdvs();
            atualizaVisibilidadePdv();
            preencherDataAtual();
        }

        document.addEventListener("DOMContentLoaded", function() {
            populaLojas();
            populaPdvs();
            atualizaLogs();
            atualizaVisibilidadePdv();
            preencherDataAtual();
            document.getElementById("loja").addEventListener("change", function() {
                populaPdvs();
                atualizaLogs();
                atualizaVisibilidadePdv();
            });
        });

        function mostrarAlerta(mensagem, tipo) {
            var alerta = document.getElementById("alerta");
            alerta.textContent = mensagem;
            alerta.className = "alerta alerta-" + tipo;
            alerta.style.display = "block";
            if (tipo === "sucesso") {
                setTimeout(function() { alerta.style.display = "none"; }, 6000);
            }
        }

        function ocultarAlerta() {
            document.getElementById("alerta").style.display = "none";
        }

        document.addEventListener("focusin", function(e) {
            if (e.target.matches("input, select, textarea")) ocultarAlerta();
        });

        document.addEventListener("DOMContentLoaded", function() {
            document.getElementById("painel").addEventListener("submit", function(e) {
                e.preventDefault();
                ocultarAlerta();

                var logsMarcados = document.querySelectorAll('#logs input[type="checkbox"]:checked');
                if (logsMarcados.length === 0) {
                    mostrarAlerta("Selecione ao menos um arquivo de log antes de solicitar.", "erro");
                    return;
                }

                if (document.getElementById("data").value > dataHojeISO()) {
                    mostrarAlerta("A data dos logs não pode ser futura.", "erro");
                    return;
                }

                enviarSolicitacao(e.target, _entregaEscolhida);
            });
        });

        // Qual botão foi clicado: 'email' mantém o fluxo de sempre (o agente
        // responde com o ZIP anexado), 'download' faz o agente subir o arquivo
        // para o relay e o BEC baixá-lo aqui.
        var _entregaEscolhida = 'email';

        function solicitarPorEmail() {
            _entregaEscolhida = 'email';
            document.getElementById('painel').requestSubmit();
        }

        function solicitarDownload() {
            _entregaEscolhida = 'download';
            document.getElementById('painel').requestSubmit();
        }

        function limparFormulario(form) {
            form.reset();
            atualizaLogs();
            populaPdvs();
            atualizaVisibilidadePdv();
            preencherDataAtual();
        }

        function enviarSolicitacao(form, entrega) {
            var formData = new FormData(form);
            formData.set('entrega', entrega);

            fetch(form.action, { method: 'POST', body: formData })
                .then(response => response.json())
                .then(data => {
                    if (!data.sucesso) {
                        mostrarAlerta("Erro: " + data.mensagem, "erro");
                        return;
                    }
                    mostrarAlerta(data.mensagem, "sucesso");
                    limparFormulario(form);
                    if (entrega === 'download' && data.pid) {
                        aguardarArquivo(data.pid);
                    }
                })
                .catch(err => mostrarAlerta("Erro na solicitação: " + err, "erro"));
        }

        // A extração leva minutos (cópia por SMB + zip), então a tela pergunta ao
        // BEC de tempo em tempo se o agente já terminou.
        function aguardarArquivo(pid) {
            var INTERVALO = 3000;
            var LIMITE_MIN = 12;                       // desiste depois disso
            var fim = Date.now() + LIMITE_MIN * 60000;

            (function verificar() {
                if (Date.now() > fim) {
                    mostrarAlerta("O agente não respondeu em " + LIMITE_MIN + " minutos (PID " + pid +
                                  "). Verifique o log do agente.", "erro");
                    return;
                }
                fetch('/solicitar/status/' + encodeURIComponent(pid))
                    .then(r => r.json())
                    .then(st => {
                        if (!st.pronto) {
                            mostrarAlerta("Extraindo os logs no agente... (PID " + pid + ")", "sucesso");
                            setTimeout(verificar, INTERVALO);
                            return;
                        }
                        if (!st.sucesso) {
                            mostrarAlerta("O agente não conseguiu gerar os logs: " + (st.mensagem || ''), "erro");
                            return;
                        }
                        var kb = st.tamanho ? " (" + Math.round(st.tamanho / 1024) + " KB)" : "";
                        var resumo = (st.incluidos !== null && st.incluidos !== undefined)
                            ? " — " + st.incluidos + " incluído(s), " + st.faltando + " não encontrado(s)"
                            : "";
                        mostrarAlerta("Arquivo pronto" + kb + resumo + ". Baixando...", "sucesso");
                        // Navegar para a rota de download dispara o "salvar como"
                        window.location = '/solicitar/baixar/' + encodeURIComponent(pid);
                    })
                    .catch(err => {
                        mostrarAlerta("Erro ao consultar o status: " + err, "erro");
                    });
            })();
        }
    </script>
</head>
<body>
    <h2>Solicitar Logs</h2>
    <div id="alerta" style="display:none;"></div>
    <form id="painel" method="post" action="/solicitar">
        <label for="loja">Loja:</label>
        <select id="loja" name="loja" required></select>

        <div id="pdv-container">
            <label for="pdv">PDV:</label>
            <select id="pdv" name="pdv" required></select>
        </div>

        <label for="data">Data dos logs:</label>
        <input type="date" id="data" name="data" required>

        <div class="logs-container">
            <h3>Arquivos de Logs:</h3>
            <div id="logs"></div>
        </div>

        <label for="email_destino">E-mail destino:</label>
        <select id="email_destino" name="email_destino" required>
            {% set emails = config_props.get('emails_destino', '').split(',') %}
            {% for email in emails %}
                {% set email = email.strip() %}
                {% if email %}
                <option value="{{ email }}" {% if loop.first %}selected{% endif %}>{{ email }}</option>
                {% endif %}
            {% endfor %}
        </select>

        <button type="button" onclick="solicitarPorEmail()">Enviar por E-mail</button>
        <button type="button" onclick="solicitarDownload()">Download</button>
        <button type="button" onclick="limparCampos()">Limpa</button>
    </form>
</body>
</html>
